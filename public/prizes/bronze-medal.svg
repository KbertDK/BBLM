<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Ribbon -->
  <path d="M112 72 L128 48 L144 72 Z" fill="rgb(160, 120, 60)"/>
  <path d="M116 70 L128 50 L140 70 Z" fill="rgb(195, 155, 100)"/>
  <rect x="124" y="44" width="8" height="32" rx="2" fill="rgb(94, 99, 107)"/>
