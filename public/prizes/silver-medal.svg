<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Ribbon -->
  <path d="M112 72 L128 48 L144 72 Z" fill="rgb(163, 168, 176)"/>
  <path d="M116 70 L128 50 L140 70 Z" fill="rgb(201, 205, 211)"/>
  <rect x="124" y="44" width="8" height="32" rx="2" fill="rgb(94, 99, 107)"/>
  <!-- Medal shadow -->
  <circle cx="130" cy="124" r="52" fill="rgb(74, 78, 85)" opacity="0.4"/>
  <!-- Medal outer ring -->
  <circle cx="128" cy="122" r="52" fill="rgb(94, 99, 107)"/>
  <!-- Medal ring -->
  <circle cx="128" cy="122" r="44" fill="rgb(163, 168, 176)"/>
  <!-- Medal face -->
  <circle cx="128" cy="122" r="36" fill="rgb(201, 205, 211)"/>
  <!-- Inner highlight ring -->
  <circle cx="128" cy="122" r="36" fill="none" stroke="rgb(230, 233, 237)" stroke-width="2" opacity="0.6"/>
  <!-- Highlight -->
  <ellipse cx="116" cy="110" rx="12" ry="8" fill="rgb(255,255,255)" opacity="0.35"/>
  <!-- Numeral -->
  <text x="128" y="140" font-size="52" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle" fill="rgb(74, 78, 85)">2</text>
  <!-- Stars -->
  <circle cx="100" cy="118" r="2.5" fill="rgb(94, 99, 107)" opacity="0.5"/>
  <circle cx="156" cy="118" r="2.5" fill="rgb(94, 99, 107)" opacity="0.5"/>
  <!-- Neck -->
  <rect x="120" y="170" width="16" height="10" fill="rgb(94, 99, 107)"/>
  <ellipse cx="128" cy="174" rx="14" ry="5" fill="rgb(224, 168, 58)"/>
  <!-- Base -->
  <rect x="98" y="176" width="60" height="10" rx="3" fill="rgb(224, 168, 58)"/>
  <rect x="88" y="186" width="80" height="14" rx="4" fill="rgb(163, 168, 176)"/>
  <rect x="76" y="198" width="104" height="22" rx="6" fill="rgb(94, 99, 107)"/>
  <rect x="84" y="203" width="88" height="3" rx="1.5" fill="rgb(255, 255, 255)" opacity="0.18"/>
